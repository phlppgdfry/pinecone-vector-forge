# ==============================================================================
# Pinecone Vector Forge — Local & Production Docker Compose Stack
# ==============================================================================

services:
  vectorforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinecone-vector-forge
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-vector-forge-knowledge}
      - PINECONE_CLOUD=${PINECONE_CLOUD:-aws}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      - PINECONE_DIMENSION=${PINECONE_DIMENSION:-1536}
      - PINECONE_METRIC=${PINECONE_METRIC:-cosine}
      - APP_ENV=production
    volumes:
      # Mount secrets safely if present
      - type: bind
        source: ~/.config/pinecone
        target: /app/.pinecone-config
        read_only: true
        consistency: cached
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
