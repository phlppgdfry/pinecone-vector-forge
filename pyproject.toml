[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinecone-vector-forge"
version = "1.0.0"
description = "Production-grade Vector Intelligence, Hybrid Search & RAG Engine powered by Pinecone Serverless"
authors = [
    { name = "Philippe Godfroy", email = "philippe.godfroy@hotmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pinecone", "vector-database", "rag", "embeddings", "hybrid-search", "semantic-search", "ai-engineering"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pinecone>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.0"
]

[project.scripts]
vectorforge = "src.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
